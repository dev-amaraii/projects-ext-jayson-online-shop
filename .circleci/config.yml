version: 2.1

parameters:
  run_validation:
    type: boolean
    default: false
  run_preview_qa:
    type: boolean
    default: false

jobs:
  validate:
    docker:
      - image: cimg/node:24.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify pinned pnpm via Corepack
          command: |
            corepack pnpm --version
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: corepack pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      # TanStack Start generates src/routeTree.gen.ts during Vite build.
      # On a fresh CI checkout it does not exist yet, so build before tsc.
      - run:
          name: Production build and generate TanStack routes
          command: corepack pnpm build
      - run:
          name: Run storefront unit tests
          command: corepack pnpm test
      - run:
          name: Typecheck generated application
          command: corepack pnpm typecheck
      - run:
          name: Build static Cloudflare Pages client preview
          command: corepack pnpm --filter @jayson/storefront build:pages

  preview-qa:
    docker:
      - image: cimg/node:24.13-browsers
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install application dependencies
          command: corepack pnpm install --frozen-lockfile
      - run:
          name: Build storefront
          command: corepack pnpm build
      - run:
          name: Build exact Cloudflare Pages client-preview artifact
          command: corepack pnpm --filter @jayson/storefront build:pages
      - run:
          name: Install QA Intel in isolated runner directory
          command: |
            mkdir -p /tmp/jayson-qa-runner
            cd /tmp/jayson-qa-runner
            npm install --no-audit --no-fund --save-exact @qutecoder/qa-intel@0.2.0
            npx playwright install chromium
      - run:
          name: Start storefront preview server
          background: true
          command: corepack pnpm --filter @jayson/storefront preview:pages > /tmp/jayson-storefront.log 2>&1
      - run:
          name: Wait for storefront preview server
          command: |
            for i in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
              sleep 2
            done
            cat /tmp/jayson-storefront.log
            exit 1
      - run:
          name: Execute QA Intel browser smoke scenarios
          command: |
            set -o pipefail
            mkdir -p .qa-results/artifacts
            /tmp/jayson-qa-runner/node_modules/.bin/qa-runner tests/features/storefront-preview.feature \
              --base-url http://127.0.0.1:3000 \
              --results-db .qa-results/results.db \
              --artifact-dir .qa-results/artifacts | tee .qa-results/qa-intel-output.json
      - store_artifacts:
          path: .qa-results
          destination: qa-intel
      - store_artifacts:
          path: /tmp/jayson-storefront.log
          destination: storefront.log

workflows:
  manually-requested-validation:
    when: << pipeline.parameters.run_validation >>
    jobs:
      - validate:
          filters:
            branches:
              only:
                - feat/storefront-demo
                - main

  manually-requested-preview-qa:
    when: << pipeline.parameters.run_preview_qa >>
    jobs:
      - preview-qa:
          filters:
            branches:
              only:
                - feat/storefront-demo
                - main
