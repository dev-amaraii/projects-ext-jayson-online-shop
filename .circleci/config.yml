version: 2.1

parameters:
  run_validation:
    type: boolean
    default: false

jobs:
  validate:
    docker:
      - image: cimg/node:24.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify pinned pnpm via Corepack
          command: |
            corepack pnpm --version
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: corepack pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      # TanStack Start generates src/routeTree.gen.ts during Vite build.
      # On a fresh CI checkout it does not exist yet, so build before tsc.
      - run:
          name: Production build and generate TanStack routes
          command: corepack pnpm build
      - run:
          name: Typecheck generated application
          command: corepack pnpm typecheck

workflows:
  manually-requested-validation:
    when: << pipeline.parameters.run_validation >>
    jobs:
      - validate:
          filters:
            branches:
              only:
                - feat/storefront-demo
                - main
